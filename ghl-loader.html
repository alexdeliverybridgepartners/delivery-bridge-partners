<!-- DeliveryBridge Partners: GitHub → GHL loader.
     Paste this ONCE into a single Custom Code / HTML element on a blank, full-width page.
     After that, edit site.html in GitHub and commit; the live page picks up the new version automatically.
     Only edit the three lines marked "EDIT". -->
<div id="dbp-root" style="min-height:100vh;background:#F7F3EA"></div>
<noscript>DeliveryBridge Partners &middot; 702-766-5271 &middot; contact@deliverybridgepartners.com</noscript>
<script>
(function () {
  'use strict';
  var OWNER  = 'YOUR-GITHUB-USERNAME';      // EDIT: your GitHub username or organization
  var REPO   = 'delivery-bridge-partners';  // EDIT: repository name
  var BRANCH = 'main';                      // EDIT: branch that holds the live site
  var FILE   = 'site.html';                 // file in the repo root to load

  var root = document.getElementById('dbp-root');
  var KEY = 'dbp-sha-' + OWNER + '-' + REPO;

  function cdn(ref) { return 'https://cdn.jsdelivr.net/gh/' + OWNER + '/' + REPO + '@' + ref + '/' + FILE; }
  function raw() { return 'https://raw.githubusercontent.com/' + OWNER + '/' + REPO + '/' + BRANCH + '/' + FILE; }

  function getText(url) {
    return fetch(url, { cache: 'no-cache' }).then(function (r) {
      if (!r.ok) throw new Error(url + ' ' + r.status);
      return r.text();
    });
  }

  // Latest commit on the branch, cached for 5 minutes per visitor, so new commits show up fast.
  function latestSha() {
    try {
      var c = JSON.parse(sessionStorage.getItem(KEY) || 'null');
      if (c && Date.now() - c.t < 300000) return Promise.resolve(c.sha);
    } catch (e) {}
    return fetch('https://api.github.com/repos/' + OWNER + '/' + REPO + '/commits/' + BRANCH, {
      headers: { Accept: 'application/vnd.github.sha' }
    }).then(function (r) {
      if (!r.ok) throw new Error('GitHub API ' + r.status);
      return r.text();
    }).then(function (sha) {
      sha = sha.trim();
      try { sessionStorage.setItem(KEY, JSON.stringify({ sha: sha, t: Date.now() })); } catch (e) {}
      return sha;
    });
  }

  // Insert the site and run its scripts in order (scripts added via innerHTML don't run on their own).
  function mount(html) {
    root.innerHTML = html;
    var scripts = root.querySelectorAll('script');
    for (var i = 0; i < scripts.length; i++) {
      var old = scripts[i], s = document.createElement('script');
      for (var j = 0; j < old.attributes.length; j++) s.setAttribute(old.attributes[j].name, old.attributes[j].value);
      s.text = old.textContent;
      old.parentNode.replaceChild(s, old);
    }
    root.style.minHeight = '';
  }

  function fail(err) {
    if (window.console) console.error('DeliveryBridge site failed to load:', err);
    root.innerHTML = '<div style="max-width:640px;margin:15vh auto;padding:24px;font-family:Arial,sans-serif;color:#222B28;text-align:center">' +
      '<h1 style="color:#173F36;font-size:28px;margin:0 0 12px">DeliveryBridge Partners</h1>' +
      '<p style="margin:0">Project talent. PMO expertise. Better delivery, together.</p>' +
      '<p style="margin:16px 0 0">702-766-5271 &middot; <a href="mailto:contact@deliverybridgepartners.com" style="color:#173F36">contact@deliverybridgepartners.com</a></p></div>';
  }

  // Exact latest commit via jsDelivr → branch via jsDelivr → GitHub raw file.
  latestSha()
    .then(function (sha) { return getText(cdn(sha)); })
    .catch(function () { return getText(cdn(BRANCH)); })
    .catch(function () { return getText(raw()); })
    .then(mount)
    .catch(fail);
})();
</script>
